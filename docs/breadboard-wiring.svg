<svg viewBox="0 0 680 495" width="100%" xmlns="http://www.w3.org/2000/svg" role="img">
<title>温控风扇物联网网关原理图</title>
<desc>STM32F103C8T6 连接 DHT11、OLED、ESP8266、TB6612 电机驱动与供电轨道的接线图</desc>

<rect x="250" y="120" width="180" height="210" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="145" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">STM32F103C8T6</text>
<text x="340" y="163" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185FA5">主控 MCU</text>
<text x="264" y="180" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0C447C">PA1   DHT11</text>
<text x="264" y="225" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0C447C">PA2   调试 TX</text>
<text x="264" y="250" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0C447C">PA4   AIN1</text>
<text x="264" y="275" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0C447C">PA5   AIN2</text>
<text x="264" y="300" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0C447C">PA0   PWMA</text>
<text x="416" y="180" text-anchor="end" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0C447C">PB8   SCL</text>
<text x="416" y="205" text-anchor="end" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0C447C">PB9   SDA</text>
<text x="416" y="250" text-anchor="end" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0C447C">PB10  ESP TX</text>
<text x="416" y="275" text-anchor="end" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0C447C">PB11  ESP RX</text>

<rect x="45" y="158" width="155" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="122" y="176" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">DHT11</text>
<text x="122" y="192" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">DATA · VCC · GND</text>

<rect x="45" y="203" width="155" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="122" y="221" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">CH340 串口</text>
<text x="122" y="237" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">RXD · TXD · 5V</text>

<rect x="45" y="252" width="155" height="78" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="122" y="270" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">TB6612 驱动</text>
<text x="122" y="288" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">PWMA · AIN1 · AIN2</text>
<text x="122" y="316" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">OUT → 风扇电机</text>

<rect x="480" y="158" width="155" height="44" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="557" y="176" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">OLED 0.96</text>
<text x="557" y="192" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">SCL · SDA · VCC</text>

<rect x="480" y="240" width="155" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="557" y="258" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">ESP8266-01S</text>
<text x="557" y="276" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">RX · TX · VCC · EN</text>

<rect x="480" y="310" width="155" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="557" y="328" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#633806">AMS1117-3.3</text>
<text x="557" y="344" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#854F0B">独立一路 + 100µF</text>

<rect x="45" y="345" width="155" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="122" y="363" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#633806">6V 电池盒</text>
<text x="122" y="379" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#854F0B">→ TB6612 VM</text>

<path d="M200 180 H250" fill="none" stroke="#5F5E5A" stroke-width="1"/>
<text x="225" y="172" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">PA1</text>
<path d="M200 225 H250" fill="none" stroke="#5F5E5A" stroke-width="1"/>
<text x="225" y="217" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">PA2</text>
<path d="M200 270 H215 V250 H250" fill="none" stroke="#5F5E5A" stroke-width="1"/>
<path d="M200 290 H208 V275 H250" fill="none" stroke="#5F5E5A" stroke-width="1"/>
<path d="M200 310 H220 V300 H250" fill="none" stroke="#5F5E5A" stroke-width="1"/>
<text x="228" y="336" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">PA4 · PA5 · PA0</text>
<path d="M122 345 V330" fill="none" stroke="#854F0B" stroke-width="1"/>
<text x="130" y="338" font-family="sans-serif" font-size="12" fill="#854F0B">VM</text>

<path d="M480 175 H465 V180 H430" fill="none" stroke="#5F5E5A" stroke-width="1"/>
<path d="M480 193 H470 V205 H430" fill="none" stroke="#5F5E5A" stroke-width="1"/>
<text x="450" y="170" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">PB8 · PB9</text>
<path d="M480 252 H455 V250 H430" fill="none" stroke="#5F5E5A" stroke-width="1"/>
<path d="M480 272 H445 V275 H430" fill="none" stroke="#5F5E5A" stroke-width="1"/>
<text x="450" y="240" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">PB10 · PB11</text>
<path d="M557 310 V296" fill="none" stroke="#854F0B" stroke-width="1"/>
<text x="566" y="303" font-family="sans-serif" font-size="12" fill="#854F0B">3.3V</text>

<rect x="45" y="415" width="155" height="40" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="122" y="428" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#633806">5V 轨</text>
<text x="122" y="444" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#854F0B">CH340 · 电机</text>

<rect x="240" y="415" width="200" height="40" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="340" y="428" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#633806">3.3V 轨</text>
<text x="340" y="444" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#854F0B">MCU · OLED · DHT11</text>

<rect x="480" y="415" width="155" height="40" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="557" y="428" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#633806">GND</text>
<text x="557" y="444" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#854F0B">所有模块共地</text>

<text x="40" y="472" font-family="sans-serif" font-size="12" fill="#5F5E5A">要点：电机 VM 与 ESP 各自独立供电，别从 3.3V 轨取电；三条轨道的 GND 必须连在一起</text>
</svg>
