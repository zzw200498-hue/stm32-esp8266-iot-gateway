<svg viewBox="0 0 680 600" width="100%" xmlns="http://www.w3.org/2000/svg">
  <title>STM32 + ESP8266 上报链路接线图</title>
  <desc>STM32F103C8T6 通过 USART2 连接 ESP-01S 转接板，CH340 提供供电和旁听，数据经家庭路由器上报 Ubuntu 虚拟机 TCP 服务器</desc>

  <text x="40" y="30" font-size="15" font-weight="500" fill="#2C2C2A" font-family="sans-serif">STM32 + ESP8266 上报链路 · 接线图</text>

  <rect x="430" y="18" width="225" height="42" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text x="542" y="35" text-anchor="middle" font-size="12" fill="#633806" font-family="sans-serif">家庭路由器（WiFi）</text>
  <text x="542" y="52" text-anchor="middle" font-size="12" fill="#633806" font-family="sans-serif">Ubuntu VM · TCP Server :9999</text>

  <line x1="540" y1="90" x2="540" y2="60" stroke="#BA7517" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>

  <rect x="50" y="90" width="180" height="190" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="140" y="115" text-anchor="middle" font-size="13" font-weight="500" fill="#0C447C" font-family="sans-serif">STM32F103C8T6</text>
  <text x="222" y="134" text-anchor="end" font-size="12" fill="#0C447C" font-family="sans-serif">PA2 (TX)</text>
  <text x="222" y="164" text-anchor="end" font-size="12" fill="#0C447C" font-family="sans-serif">PA3 (RX)</text>
  <text x="222" y="264" text-anchor="end" font-size="12" fill="#444441" font-family="sans-serif">GND</text>

  <rect x="450" y="90" width="180" height="190" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="540" y="115" text-anchor="middle" font-size="13" font-weight="500" fill="#085041" font-family="sans-serif">ESP-01S 转接板</text>
  <text x="458" y="134" font-size="12" fill="#085041" font-family="sans-serif">RX</text>
  <text x="458" y="164" font-size="12" fill="#085041" font-family="sans-serif">TX</text>
  <text x="458" y="224" font-size="12" fill="#085041" font-family="sans-serif">VCC</text>
  <text x="458" y="254" font-size="12" fill="#085041" font-family="sans-serif">GND</text>
  <text x="540" y="248" text-anchor="middle" font-size="11" fill="#5F5E5A" font-family="sans-serif">板载 3.3V LDO</text>

  <line x1="230" y1="130" x2="450" y2="130" stroke="#185FA5" stroke-width="2" fill="none"/>
  <text x="340" y="122" text-anchor="middle" font-size="11" fill="#185FA5" font-family="sans-serif">USART2 TX（发 AT / 数据）</text>
  <line x1="230" y1="160" x2="450" y2="160" stroke="#378ADD" stroke-width="2" fill="none"/>
  <text x="340" y="176" text-anchor="middle" font-size="11" fill="#378ADD" font-family="sans-serif">USART2 RX（收回复）</text>

  <line x1="90" y1="320" x2="620" y2="320" stroke="#A32D2D" stroke-width="3" fill="none"/>
  <text x="90" y="310" font-size="12" font-weight="500" fill="#A32D2D" font-family="sans-serif">面包板红轨 5V</text>
  <line x1="130" y1="350" x2="620" y2="350" stroke="#444441" stroke-width="3" fill="none"/>
  <text x="130" y="368" font-size="12" font-weight="500" fill="#444441" font-family="sans-serif">面包板蓝轨 GND</text>

  <polyline points="450,220 400,220 400,320" stroke="#A32D2D" stroke-width="2" fill="none"/>
  <polyline points="450,250 440,250 440,350" stroke="#444441" stroke-width="2" fill="none"/>
  <polyline points="140,280 140,350" stroke="#444441" stroke-width="2" fill="none"/>

  <rect x="50" y="400" width="180" height="110" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="90" y="425" font-size="13" font-weight="500" fill="#444441" font-family="sans-serif">CH340</text>
  <polyline points="90,400 90,320" stroke="#A32D2D" stroke-width="2" fill="none"/>
  <text x="72" y="415" font-size="11" fill="#A32D2D" font-family="sans-serif">5V</text>
  <polyline points="130,400 130,350" stroke="#444441" stroke-width="2" fill="none"/>
  <text x="136" y="415" font-size="11" fill="#444441" font-family="sans-serif">GND</text>

  <polyline points="230,440 300,440 300,160" stroke="#888780" stroke-width="1.5" stroke-dasharray="5 3" fill="none"/>
  <text x="296" y="392" font-size="11" fill="#888780" font-family="sans-serif">旁听 RXD（可选）</text>
  <circle cx="300" cy="160" r="3.5" fill="#378ADD"/>

  <line x1="245" y1="463" x2="257" y2="475" stroke="#A32D2D" stroke-width="2"/>
  <line x1="245" y1="475" x2="257" y2="463" stroke="#A32D2D" stroke-width="2"/>
  <text x="264" y="474" font-size="11" fill="#A32D2D" font-family="sans-serif">TXD 不接（PA2 已接管）</text>

  <polyline points="560,320 560,333" stroke="#A32D2D" stroke-width="2" fill="none"/>
  <line x1="550" y1="334" x2="570" y2="334" stroke="#444441" stroke-width="2.5"/>
  <line x1="550" y1="341" x2="570" y2="341" stroke="#444441" stroke-width="2.5"/>
  <polyline points="560,341 560,350" stroke="#444441" stroke-width="2" fill="none"/>
  <text x="578" y="336" font-size="11" fill="#444441" font-family="sans-serif">470µF</text>
  <text x="546" y="330" font-size="12" fill="#A32D2D" font-weight="500" font-family="sans-serif">+</text>

  <circle cx="400" cy="320" r="3.5" fill="#A32D2D"/>
  <circle cx="560" cy="320" r="3.5" fill="#A32D2D"/>
  <circle cx="130" cy="350" r="3.5" fill="#444441"/>
  <circle cx="140" cy="350" r="3.5" fill="#444441"/>
  <circle cx="440" cy="350" r="3.5" fill="#444441"/>
  <circle cx="560" cy="350" r="3.5" fill="#444441"/>

  <text x="40" y="560" font-size="12" fill="#5F5E5A" font-family="sans-serif">供电：CH340 5V → ESP-01S；ST-Link / USB → STM32。所有 GND 汇合于蓝轨（共地）。</text>
  <text x="40" y="580" font-size="12" fill="#5F5E5A" font-family="sans-serif">调试：CH340 RXD 旁听 ESP 回复（串口助手 115200 可实时看到 AT 交互）。</text>
</svg>
