<svg viewBox="0 0 680 540" width="100%" xmlns="http://www.w3.org/2000/svg">
  <title>STM32 + ESP8266 上报链路原理图</title>
  <desc>STM32F103C8T6 通过 USART2 连接 ESP-01S（转接板），CH340 提供供电与调试旁听，C1 为 ESP 供电退耦电容</desc>

  <text x="40" y="28" font-size="15" font-weight="500" fill="#2C2C2A" font-family="sans-serif">STM32 + ESP8266 上报链路 · 原理图</text>

  <rect x="140" y="90" width="210" height="250" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="245" y="112" text-anchor="middle" font-size="13" font-weight="500" fill="#0C447C" font-family="sans-serif">U1  STM32F103C8T6</text>

  <line x1="245" y1="78" x2="245" y2="90" stroke="#444441" stroke-width="1.5" fill="none"/>
  <text x="245" y="72" text-anchor="middle" font-size="12" fill="#A32D2D" font-weight="500" font-family="sans-serif">+3V3</text>
  <text x="251" y="102" font-size="11" fill="#0C447C" font-family="sans-serif">VDD</text>

  <line x1="245" y1="340" x2="245" y2="352" stroke="#444441" stroke-width="1.5" fill="none"/>
  <line x1="237" y1="352" x2="253" y2="352" stroke="#444441" stroke-width="1.5"/>
  <line x1="240" y1="356" x2="250" y2="356" stroke="#444441" stroke-width="1.5"/>
  <line x1="243" y1="360" x2="247" y2="360" stroke="#444441" stroke-width="1.5"/>
  <text x="251" y="346" font-size="11" fill="#0C447C" font-family="sans-serif">VSS</text>

  <text x="344" y="134" text-anchor="end" font-size="11" fill="#0C447C" font-family="sans-serif">PA2  USART2_TX</text>
  <text x="344" y="164" text-anchor="end" font-size="11" fill="#0C447C" font-family="sans-serif">PA3  USART2_RX</text>
  <text x="344" y="284" text-anchor="end" font-size="11" fill="#0C447C" font-family="sans-serif">PA13 SWDIO</text>
  <text x="344" y="314" text-anchor="end" font-size="11" fill="#0C447C" font-family="sans-serif">PA14 SWCLK</text>
  <text x="146" y="234" font-size="11" fill="#0C447C" font-family="sans-serif">PA0  ADC_IN0（预留）</text>

  <line x1="350" y1="130" x2="368" y2="130" stroke="#444441" stroke-width="1.5"/>
  <line x1="368" y1="130" x2="443" y2="130" stroke="#444441" stroke-width="1.5" fill="none"/>
  <text x="405" y="122" text-anchor="middle" font-size="11" fill="#185FA5" font-weight="500" font-family="sans-serif">USART2_TX</text>

  <line x1="350" y1="160" x2="368" y2="160" stroke="#444441" stroke-width="1.5"/>
  <line x1="368" y1="160" x2="443" y2="160" stroke="#444441" stroke-width="1.5" fill="none"/>
  <text x="405" y="152" text-anchor="middle" font-size="11" fill="#185FA5" font-weight="500" font-family="sans-serif">USART2_RX</text>

  <rect x="455" y="90" width="190" height="190" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="550" y="112" text-anchor="middle" font-size="13" font-weight="500" fill="#085041" font-family="sans-serif">U2  ESP-01S（转接板）</text>
  <text x="461" y="134" font-size="11" fill="#085041" font-family="sans-serif">RX</text>
  <text x="461" y="164" font-size="11" fill="#085041" font-family="sans-serif">TX</text>
  <text x="461" y="214" font-size="11" fill="#085041" font-family="sans-serif">VCC</text>
  <text x="461" y="244" font-size="11" fill="#085041" font-family="sans-serif">GND</text>
  <text x="550" y="266" text-anchor="middle" font-size="11" fill="#5F5E5A" font-family="sans-serif">板载 3.3V LDO + 电平转换</text>

  <polyline points="443,210 410,210 410,190" stroke="#A32D2D" stroke-width="1.5" fill="none"/>
  <text x="410" y="182" text-anchor="middle" font-size="12" fill="#A32D2D" font-weight="500" font-family="sans-serif">+5V</text>

  <polyline points="443,240 420,240 420,258" stroke="#444441" stroke-width="1.5" fill="none"/>
  <line x1="412" y1="258" x2="428" y2="258" stroke="#444441" stroke-width="1.5"/>
  <line x1="415" y1="262" x2="425" y2="262" stroke="#444441" stroke-width="1.5"/>
  <line x1="418" y1="266" x2="422" y2="266" stroke="#444441" stroke-width="1.5"/>

  <polyline points="380,298 380,312" stroke="#A32D2D" stroke-width="1.5" fill="none"/>
  <text x="380" y="292" text-anchor="middle" font-size="12" fill="#A32D2D" font-weight="500" font-family="sans-serif">+5V</text>
  <line x1="370" y1="313" x2="390" y2="313" stroke="#444441" stroke-width="2"/>
  <line x1="370" y1="319" x2="390" y2="319" stroke="#444441" stroke-width="2"/>
  <polyline points="380,319 380,332" stroke="#444441" stroke-width="1.5" fill="none"/>
  <line x1="372" y1="332" x2="388" y2="332" stroke="#444441" stroke-width="1.5"/>
  <line x1="375" y1="336" x2="385" y2="336" stroke="#444441" stroke-width="1.5"/>
  <line x1="378" y1="340" x2="382" y2="340" stroke="#444441" stroke-width="1.5"/>
  <text x="396" y="320" font-size="11" fill="#444441" font-family="sans-serif">C1 470µF（退耦，靠近 U2 放置）</text>

  <rect x="140" y="400" width="200" height="110" rx="6" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text x="240" y="422" text-anchor="middle" font-size="13" font-weight="500" fill="#444441" font-family="sans-serif">U3  CH340 USB-TTL</text>

  <polyline points="128,430 110,430 110,412" stroke="#A32D2D" stroke-width="1.5" fill="none"/>
  <text x="110" y="404" text-anchor="middle" font-size="12" fill="#A32D2D" font-weight="500" font-family="sans-serif">+5V</text>
  <text x="146" y="434" font-size="11" fill="#444441" font-family="sans-serif">5V</text>

  <polyline points="128,460 110,460 110,472" stroke="#444441" stroke-width="1.5" fill="none"/>
  <line x1="102" y1="472" x2="118" y2="472" stroke="#444441" stroke-width="1.5"/>
  <line x1="105" y1="476" x2="115" y2="476" stroke="#444441" stroke-width="1.5"/>
  <line x1="108" y1="480" x2="112" y2="480" stroke="#444441" stroke-width="1.5"/>
  <text x="146" y="464" font-size="11" fill="#444441" font-family="sans-serif">GND</text>

  <polyline points="340,430 400,430" stroke="#444441" stroke-width="1.5" fill="none"/>
  <text x="146" y="434" font-size="11" fill="#444441" font-family="sans-serif">RXD</text>
  <text x="406" y="434" font-size="11" fill="#888780" font-family="sans-serif">至 ESP TX（旁听，可选）</text>

  <polyline points="340,462 380,462" stroke="#444441" stroke-width="1.5" fill="none"/>
  <text x="146" y="466" font-size="11" fill="#444441" font-family="sans-serif">TXD</text>
  <line x1="362" y1="456" x2="374" y2="468" stroke="#A32D2D" stroke-width="2"/>
  <line x1="362" y1="468" x2="374" y2="456" stroke="#A32D2D" stroke-width="2"/>
  <text x="382" y="466" font-size="11" fill="#A32D2D" font-family="sans-serif">不接（由 U1 的 PA2 驱动 ESP RX）</text>

  <polyline points="368,280 400,280" stroke="#444441" stroke-width="1.5" fill="none"/>
  <polyline points="368,310 400,310" stroke="#444441" stroke-width="1.5" fill="none"/>
  <rect x="400" y="265" width="130" height="56" rx="6" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text x="465" y="288" text-anchor="middle" font-size="11" fill="#633806" font-family="sans-serif">ST-Link</text>
  <text x="465" y="305" text-anchor="middle" font-size="11" fill="#633806" font-family="sans-serif">烧录 + 供电</text>

  <text x="40" y="528" font-size="12" fill="#5F5E5A" font-family="sans-serif">注：所有 GND 网络相连（共地）。ESP 供电取自 CH340 的 5V，经转接板板载 LDO 降至 3.3V；C1 吸收 ESP 发射瞬间的电流波动。</text>
</svg>
